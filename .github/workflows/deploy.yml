name: Deploy Next.js to cPanel FTP

on:
  push:
    branches:
      - main # এই ব্রাঞ্চে পুশ করলেই অটোমেটিক ডিপ্লয় হবে

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Prepare Standalone Directory
        run: |
          # Copy public and static files for Next.js standalone
          cp -r public .next/standalone/ || true
          cp -r .next/static .next/standalone/.next/

          # Fix server.js port mapping for cPanel Passenger
          sed -i "s/const currentPort = parseInt(process.env.PORT, 10) || 3000/const currentPort = process.env.PORT || 3000/g" .next/standalone/server.js
          sed -i "s/const hostname = process.env.HOSTNAME || '0.0.0.0'/const hostname = typeof process.env.PORT === 'string' \&\& process.env.PORT.startsWith('\/') ? undefined : (process.env.HOSTNAME || '0.0.0.0')/g" .next/standalone/server.js

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .next/standalone/
          server-dir: ./
